name: Supabase activity (every 3 days)
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one leaderboard row (no writes or service role)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUB_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            "$SUPABASE_URL/rest/v1/scores?select=best_score&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -o /dev/null
